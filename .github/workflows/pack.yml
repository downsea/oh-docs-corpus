# pack.yml — verify a maintainer-built OpenHarmony docs pack and promote it to the latest release.
#
# What it serves: `oh docs update --corpus openharmony` reads
#   https://github.com/downsea/oh-docs-corpus/releases/latest/download/manifest.json
# and then the asset the manifest names (oh ADR-0109). That consumer contract —
# manifest fields, asset name `openharmony-zh-cn-<YYYYMMDD>-<commit8>.zip`, zip layout —
# is owned by tools/build-docs-corpus.py and must not change here.
#
# Route (maintainer ruling 2026-10-27; research docs/research/2026-10-27-ci-for-docs-packs.md §9):
# CI does NOT build. Hosted runners are throttled by gitcode's raw host (HTTP 418 after the
# listing, runs 40469395436 / 40470785867), so the maintainer builds on a developer host and
# uploads zip + .sha256 + manifest.json as a DRAFT release, then pushes the tag. This workflow:
#   1. downloads the draft's assets;
#   2. lists gitcode's tree at the manifest's commit (~130 API GETs, no raw fetch);
#   3. checks every page's git blob sha1 against that tree, equal page sets, the page floor
#      (>= MIN_DOCUMENTS and >= 90% of releases/latest), newer than releases/latest;
#   4. checks manifest fields, sha256, asset name = tag, the .sha256 sidecar;
#   5. only then publishes the draft as the latest release and reads the manifest back from
#      the URL oh uses. Any failure leaves the draft a draft and says why.
#
# Triggers:
#   - push of a tag that is LITERALLY the release name openharmony-zh-cn-<YYYYMMDD>-<commit8>
#     = verify + PUBLISH that tag's draft (a tag whose release is already published: no-op).
#   - workflow_dispatch (input `tag`; empty = releases/latest) = the same verification, never publishes.
#   - No push / PR / schedule trigger (family no-push-CI rule).
#
# Family rules applied (downsea/ci-workflows CLAUDE.md hard rules + docs/CONTRACT.md):
# ubuntu-22.04 only (rule 5); persist-credentials: false; no set -x and no secret — public repo,
# GITHUB_TOKEN publishes its own releases (rule 7); no pipeline whose reader can exit first
# (rule 8); contents: read at the top, contents: write only on the one job that must read a
# DRAFT (drafts are listed only to tokens with push access) and promote it (rule 9, CONTRACT §4);
# no artifact at all (rule 10 moot); `.sha256` in sha256sum -c format (rule 4, CONTRACT §1).
# A caller-owned workflow, not a ci-workflows reusable one: a public repository cannot call a
# reusable workflow stored in a private repository (research §1).

name: pack

on:
  push:
    tags: ['openharmony-zh-cn-[0-9]+-[0-9a-f]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to verify (draft or published), openharmony-zh-cn-<YYYYMMDD>-<commit8>; empty = releases/latest. Never publishes.'
        type: string
        default: ''

permissions:
  contents: read

# One at a time: two promotions racing for releases/latest is the failure to prevent.
concurrency:
  group: pack
  cancel-in-progress: false

env:
  # Absolute page floor; the effective floor is max(this, ceil(0.9 x releases/latest's
  # documents)) — tools/build-docs-corpus.py floor_of(). 5,964 pages at 2026-10-27.
  MIN_DOCUMENTS: '5000'
  LATEST_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/manifest.json

jobs:
  verify:
    runs-on: ubuntu-22.04
    # Listing ~130 tree pages took ~10 min from a hosted runner (run 40469395436; 44-81 s on
    # a developer host), with up to 4 retries per GET.
    timeout-minutes: 40
    permissions:
      contents: write   # read a DRAFT release; promote it. Nothing else.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Self-test (offline)
        run: python3 -I tools/build-docs-corpus.py --self-test

      - name: Plan — which release, verify only or publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          name_re='^openharmony-zh-cn-[0-9]{8}-[0-9a-f]{8}$'
          if [[ "$EVENT" == push && "$REF_TYPE" == tag ]]; then
            mode=publish
            tag="$REF_NAME"
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            mode=verify-only
            tag="$INPUT_TAG"
            if [[ -z "$tag" ]]; then
              tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            fi
          else
            echo "::error::event $EVENT on $REF_TYPE '$REF_NAME' is neither a pack tag nor a dispatch; refusing to guess"
            exit 1
          fi
          if [[ ! "$tag" =~ $name_re ]]; then
            echo "::error::'$tag' is not openharmony-zh-cn-<YYYYMMDD>-<commit8>; get the name with: python3 -I tools/build-docs-corpus.py --resolve"
            exit 1
          fi

          state=none
          if draft=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then state=draft; else state=published; fi
          fi
          run=true
          publish=false
          case "$mode/$state" in
            publish/published)
              echo "::notice::release $tag is already published; nothing to do (published assets are immutable)"
              run=false ;;
            publish/draft)
              publish=true ;;
            publish/none)
              echo "::error::no draft release $tag. Build and upload it first (CLAUDE.md, Releasing): gh release create $tag --draft ... then re-run this workflow"
              exit 1 ;;
            verify-only/none)
              echo "::error::no release $tag (draft or published)"
              exit 1 ;;
          esac
          {
            echo "tag=$tag"
            echo "asset=$tag.zip"
            echo "run=$run"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### pack ($mode)"
            echo ""
            echo "- release: \`$tag\` · state: $state · will publish: $publish"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the release's assets
        if: ${{ steps.plan.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/pack"

      - name: Verify — gitcode tree, every page's blob sha1, floor, newer, manifest, sidecar
        if: ${{ steps.plan.outputs.run == 'true' }}
        env:
          ASSET: ${{ steps.plan.outputs.asset }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
        run: |
          prev="$RUNNER_TEMP/previous-manifest.json"
          args=(--verify "$RUNNER_TEMP/pack" --against-gitcode --require-sidecar
                --min-documents "$MIN_DOCUMENTS" --expect-asset "$ASSET")
          # The manifest oh reads today sets the 90% floor and the newer-than-latest rule.
          # Missing is a stop on a publish (it would drop both protections), a warning otherwise.
          if curl -fsSL --retry 3 --retry-delay 5 -o "$prev" "$LATEST_MANIFEST_URL"; then
            args+=(--previous-manifest "$prev")
            [[ "$PUBLISH" == true ]] && args+=(--require-newer)
          elif [[ "$PUBLISH" == true ]]; then
            echo "::error::could not fetch $LATEST_MANIFEST_URL; the page floor and the newer-than-latest check need it. The draft stays a draft."
            exit 1
          else
            echo "::warning::could not fetch $LATEST_MANIFEST_URL; verifying without the 90% floor and the newer check"
          fi
          (cd "$RUNNER_TEMP/pack" && sha256sum -c "$ASSET.sha256")
          err="$RUNNER_TEMP/verify.err"
          if ! report=$(python3 -I tools/build-docs-corpus.py "${args[@]}" 2>"$err"); then
            reason=$(< "$err")
            echo "::error::verification failed — the release stays as it is (a draft stays a draft): $reason"
            {
              echo "### verification FAILED"
              echo ""
              echo '```'
              echo "$reason"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### verified"
            echo ""
            echo '```json'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish — the draft becomes the latest release
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          dir="$RUNNER_TEMP/pack"
          # The draft must still hold exactly the bytes just verified (it is editable until now).
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,assets > "$RUNNER_TEMP/release.json"
          python3 -I - "$RUNNER_TEMP/release.json" "$dir" <<'PY'
          import hashlib, json, os, sys
          rel = json.load(open(sys.argv[1], encoding="utf-8"))
          if rel["isDraft"] is not True:
              sys.exit(f"release is no longer a draft (isDraft={rel['isDraft']}); not touching it")
          remote = {a["name"]: a.get("digest") for a in rel["assets"]}
          local = sorted(os.listdir(sys.argv[2]))
          if sorted(remote) != local:
              sys.exit(f"draft assets {sorted(remote)} differ from the verified set {local}")
          for n in local:
              want = "sha256:" + hashlib.sha256(open(os.path.join(sys.argv[2], n), "rb").read()).hexdigest()
              if remote[n] != want:
                  sys.exit(f"draft asset {n} changed after download ({remote[n]} != {want})")
          PY
          RUN_URL="$RUN_URL" python3 -I - "$dir/manifest.json" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/title.txt" <<'PY'
          import json, os, sys
          m = json.load(open(sys.argv[1], encoding="utf-8"))
          c, d = m["commit"], m["committed_at"]
          notes = (
              f"Markdown files under `zh-cn/application-dev/` of [openharmony/docs]({m['source']}) "
              f"at commit `{c}` ({d}), unmodified: {m['documents']:,} pages. "
              "CC BY 4.0, see LICENSE and NOTICE in the archive. "
              f"sha256 `{m['sha256']}` ({m['bytes']:,} bytes; also `{m['asset']}.sha256`). "
              "Built on a maintainer host with `tools/build-docs-corpus.py`; every page verified against "
              f"gitcode's tree at that commit and published by the `pack` workflow ({os.environ['RUN_URL']}); "
              "consumed by `oh docs update --corpus openharmony` (oh ADR-0109).\n"
          )
          open(sys.argv[2], "w", encoding="utf-8").write(notes)
          open(sys.argv[3], "w", encoding="utf-8").write(f"OpenHarmony zh-cn docs {d[:10]} ({c[:8]})")
          PY
          title=$(< "$RUNNER_TEMP/title.txt")
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --draft=false --latest \
            --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          echo "### published [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read it back the way oh does
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          ASSET: ${{ steps.plan.outputs.asset }}
        run: |
          # Advisory: the release is already public; a lag here is reported, not failed.
          got="$RUNNER_TEMP/latest-manifest.json"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL -o "$got" "$LATEST_MANIFEST_URL" && cmp -s "$got" "$RUNNER_TEMP/pack/manifest.json"; then
              echo "releases/latest/download/manifest.json now serves $ASSET"
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "::warning::releases/latest/download/manifest.json does not serve $ASSET yet; check by hand"
